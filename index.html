    A.armed = null; await Store.deleteSession(id); delete A.sessions[id]; render();
  }));
  $("#sitepick").onchange = async (e) => { A.siteId = e.target.value; await Store.kvSet("siteChoice", A.siteId); render(); };
  $("#loadsite").onclick = () => $("#sitefile").click();
  $("#sitefile").onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      if (j.format !== TMv.SITE_FORMAT || !j.contract || !Array.isArray(j.places)) throw new Error("this isn't an ed-tm-site/1 file");
      A.sites[j.siteId] = j; A.siteId = j.siteId; await Store.kvSet("site", j); await Store.kvSet("siteChoice", j.siteId);
      alertBanner(`Loaded ${j.siteName}: ${j.places.length} places.`, "ok");
    } catch (err) { alertBanner("Couldn't load the site file: " + err.message, "bad"); }
  };
  $("#persist").onclick = async () => { await askPersist(); await refreshStorageInfo(); render(); };
  $("#update").onclick = async () => {
    try { const r = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (r) await r.update(); } catch (e) { /* offline */ }
    location.reload();
  };
}
function alertBanner(msg, kind) { render(); const d = document.createElement("div"); d.className = "banner " + kind; d.textContent = msg; $("#app").prepend(d); }

function renderNew() {
  const st = site(), so = st.contract, F = (n) => so.session.fields.find((f) => f.name === n);
  const opts = (vals, sel, lab) => vals.map((v) => `<option value="${esc(v)}" ${v === sel ? "selected" : ""}>${esc(lab ? lab(v) : v)}</option>`).join("");
  $("#app").innerHTML = `
    <h1>New session</h1>
    <div class="muted small">Site: ${esc(st.siteName)}. No names: codes only.</div>
    <label for="code">Session code</label>
    <div class="row"><input type="text" id="code" value="${esc(C.randomCode("TM"))}" autocapitalize="characters" style="flex:1"><button id="regen">New code</button></div>
    <label for="observer">Your observer code</label>
    <input type="text" id="observer" value="${esc(Store.lsGet("tm.kv.observer") || "OBS-1")}" autocapitalize="characters">
    <label for="staffGroup">Staff group</label><select id="staffGroup">${opts(F("staffGroup").values, "doctor")}</select>
    <label for="gradeBand">Grade</label><select id="gradeBand">${opts(F("gradeBand").values, "st1_2", (v) => (st.gradeLabels && st.gradeLabels[v]) || v)}</select>
    <label for="post">Post</label><select id="post">${opts(F("post").values, "pool")}</select>
    <label for="zone">Main zone</label><select id="zone"><option value="">Mixed / not one zone</option>${st.zones.map((z) => `<option value="${esc(z.id)}">${esc(z.name)}</option>`).join("")}</select>
    <div class="row"><div style="flex:1"><label for="shiftStart">Shift start (optional)</label><input type="time" id="shiftStart"></div>
      <div style="flex:1"><label for="shiftEnd">Shift end (optional)</label><input type="time" id="shiftEnd"></div></div>
    <label class="check"><input type="checkbox" id="consent">The doctor has agreed to be observed</label>
    <label class="check"><input type="checkbox" id="pilot" checked>Pilot / method-testing session</label>
    <div id="formerr"></div>
    <div class="bar"><button id="cancel">Cancel</button><button class="primary" id="ready">Ready</button></div>
    <div class="muted small" style="margin-top:8px">The clock starts when you tap the first activity.</div>`;
  $("#regen").onclick = () => { $("#code").value = C.randomCode("TM"); };
  $("#cancel").onclick = () => { A.view = "home"; render(); };
  $("#ready").onclick = async () => {
    const code = $("#code").value.trim().toUpperCase(), observer = $("#observer").value.trim().toUpperCase();
    const errs = [];
    if (!/^[A-Z0-9-]{4,24}$/.test(code)) errs.push("Session code: 4–24 of A–Z, 0–9 and -.");
    if (A.sessions[code]) errs.push("That session code is already on this phone.");
    if (!/^[A-Z0-9-]{4,24}$/.test(observer)) errs.push("Observer code: 4–24 of A–Z, 0–9 and -.");
    if (!$("#consent").checked) errs.push("A session can't start without the doctor's agreement.");
    if (errs.length) { $("#formerr").innerHTML = `<div class="banner bad">${errs.map(esc).join("<br>")}</div>`; return; }
    const now = new Date(), at = (hhmm, ref) => { if (!hhmm) return null; const [h, m] = hhmm.split(":").map(Number); const d = new Date(ref || now); d.setHours(h, m, 0, 0); return d; };
    const ss = at($("#shiftStart").value), se0 = at($("#shiftEnd").value, ss || now);
    const se = se0 && ss && se0 <= ss ? new Date(se0.getTime() + 86400000) : se0;
    const header = { code, observer, staffGroup: $("#staffGroup").value, gradeBand: $("#gradeBand").value, post: $("#post").value,
      zone: $("#zone").value || null, shiftStart: ss ? C.iso(ss) : null, shiftEnd: se ? C.iso(se) : null, consent: "yes", pilot: $("#pilot").checked };
    Store.lsSet("tm.kv.observer", observer);
    const s = C.create(header, site(), APP_VERSION, now);
    A.sessions[s.id] = s; A.cur = s.id; await Store.saveSession(s);
    A.view = "session"; render();
  };
}

function renderSession() {
  const s = A.sessions[A.cur]; if (!s) { A.view = "home"; return render(); }
  const st = siteFor(s) || site(), so = st.contract, cur = C.current(s);
  const known = new Set(GROUPS.flatMap((g) => g[2])), extra = so.activities.map((a) => a.code).filter((c) => !known.has(c));
  const groups = GROUPS.concat(extra.length ? [["More", "--g-oth", extra]] : []);
  const label = (c) => (so.activities.find((a) => a.code === c) || {}).label || c;
  const lastPlace = s.places.length ? s.places[s.places.length - 1].place : null;
  const recent = []; for (let i = s.places.length - 1; i >= 0 && recent.length < 5; i--) if (!recent.includes(s.places[i].place)) recent.push(s.places[i].place);
  const placeName = (id) => (st.places.find((p) => p.id === id) || {}).label || id;
  const computer = cur && C.isComputer(st, cur.activity);
  const status = s.status === "ready" ? "Ready: tap the first activity to start the clock" : s.status === "paused" ? "PAUSED (time not observed)" : "Running";
  const zones = {}; for (const p of st.places) (zones[p.zone || "_"] = zones[p.zone || "_"] || []).push(p);
  const zname = (z) => z === "_" ? "Shared / no zone" : ((st.zones.find((x) => x.id === z) || {}).name || z);
  $("#app").innerHTML = `
    <div class="now">
      <div class="row spread"><span class="small"><strong>${esc(s.id)}</strong> · ${esc(status)}</span><button id="home" style="min-height:36px;padding:4px 10px">Home</button></div>
      <div class="act">${s.status === "paused" ? "Paused" : cur ? esc(actLabel(cur.activity)) : "–"}${cur && cur.screen === "not_seen" ? ' <span class="chip">screen not seen</span>' : ""}</div>
      <div class="row spread"><span class="timer" id="t-cur">0:00:00</span><span class="small muted">observed <span id="t-obs">0:00:00</span></span></div>
      <div class="small muted">Place: ${esc(lastPlace ? placeName(lastPlace) : "not set")} · <span id="wake">Screen kept on: ${esc(A.wakeState)}</span></div>
    </div>
    ${computer && s.status === "running" ? `<button class="wide" id="screen" style="margin-top:8px">${cur.screen === "not_seen" ? "Screen visible again" : "Can't see the screen"}</button>` : ""}
    ${groups.map(([g, col, codes]) => `<div class="grp">${esc(g)}</div><div class="grid">${codes.map((c) =>
      `<button class="act-btn ${cur && cur.activity === c && s.status === "running" ? "on" : ""}" style="--gc:var(${col})" data-act="${esc(c)}" title="${esc(label(c))}" ${s.status === "paused" ? "disabled" : ""}>${esc(actLabel(c))}</button>`).join("")}</div>`).join("")}
    <div class="grp">Place</div>
    <div class="places">${recent.map((p) => `<button data-place="${esc(p)}" ${p === lastPlace ? 'class="primary"' : ""}>${esc(placeName(p))}</button>`).join("")}</div>
    <select id="placepick" style="margin-top:6px"><option value="">Choose a place…</option>${Object.keys(zones).map((z) =>
      `<optgroup label="${esc(zname(z))}">${zones[z].map((p) => `<option value="${esc(p.id)}">${esc(p.label)}${p.confirm ? " (?)" : ""}</option>`).join("")}</optgroup>`).join("")}</select>
    <div class="bar">
      <button id="pause" ${s.status === "ready" ? "disabled" : ""}>${s.status === "paused" ? "Resume" : "Pause"}</button>
      <button id="end" class="${A.armed === "end" ? "armed" : "danger"}" ${s.status === "ready" ? "disabled" : ""}>${A.armed === "end" ? "Tap again to end" : "End session"}</button>
    </div>
    <h2>Recent</h2>
    <div class="card tl">${s.intervals.slice(-8).reverse().map((r) => `<div>${esc(clock(r.start))}–${esc(r.end ? clock(r.end) : "now    ")} ${esc(actLabel(r.activity))}${r.screen === "not_seen" ? " (screen not seen)" : ""}</div>`).join("") || '<span class="muted">Nothing yet.</span>'}
      ${s.pauses.length ? `<div class="muted">${s.pauses.length} pause(s)</div>` : ""}</div>
    ${s.clockFixes ? `<div class="banner warn">The phone's clock went backwards ${s.clockFixes} time(s); those taps were placed just after the one before.</div>` : ""}`;
  paintTimers();
  const save = async () => { await Store.saveSession(s); render(); };
  document.querySelectorAll("[data-act]").forEach((b) => (b.onclick = () => { if (C.setActivity(s, st, b.dataset.act, new Date())) save(); }));
  document.querySelectorAll("[data-place]").forEach((b) => (b.onclick = () => { if (C.setPlace(s, b.dataset.place, new Date())) save(); }));
  $("#placepick").onchange = (e) => { if (e.target.value && C.setPlace(s, e.target.value, new Date())) save(); };
  if ($("#screen")) $("#screen").onclick = () => { if (C.setScreen(s, st, cur.screen === "not_seen", new Date())) save(); };
  $("#pause").onclick = () => { if (s.status === "paused" ? C.resume(s, new Date()) : C.pause(s, new Date())) save(); };
  $("#end").onclick = () => {
    if (A.armed !== "end") { A.armed = "end"; render(); setTimeout(() => { if (A.armed === "end") { A.armed = null; if (A.view === "session") render(); } }, 4000); return; }
    A.armed = null;
    if (C.end(s, new Date())) { Store.saveSession(s).then(() => { A.view = "export"; A.report = null; render(); }); }
  };
  $("#home").onclick = () => { A.view = "home"; render(); };
}
function paintTimers() {
  const s = A.sessions[A.cur]; if (!s) return;
  const now = new Date(), cur = C.current(s), p = s.pauses[s.pauses.length - 1];
  const from = s.status === "paused" && p ? p.start : cur ? cur.start : null;
  const a = $("#t-cur"), b = $("#t-obs");
  if (a) a.textContent = from ? hms((now - Date.parse(from)) / 1000) : "0:00:00";
  if (b) b.textContent = hms(C.observedSec(s, now));
}

function renderExport() {
  const s = A.sessions[A.cur]; if (!s) { A.view = "home"; return render(); }
  const st = siteFor(s);
  let doc = null, rep = null, err = null;
  try { doc = C.exportDoc(s, TMv); rep = st ? TMv.validate(JSON.parse(JSON.stringify(doc)), st, C.fileName(doc)) : null; } catch (e) { err = e.message; }
  const lines = rep ? [`${rep.ok ? "Accepted" : "REFUSED"}: ${rep.errors.length} error(s), ${rep.warnings.length} warning(s)`]
    .concat(rep.errors.map((e) => "error   " + e.message), rep.warnings.map((w) => "warning " + w.message),
      rep.summary ? [`${rep.summary.intervals} intervals; observed ${hms(rep.summary.observedSec)}, out of view ${hms(rep.summary.unseenSec)}, paused ${hms(rep.summary.pausedSec)}`] : []) : [];
  $("#app").innerHTML = `
    <h1>Export ${esc(s.id)}</h1>
    ${err ? `<div class="banner bad">${esc(err)}</div>` : ""}
    ${!st ? `<div class="banner warn">The site file for "${esc(s.siteId)}" isn't loaded, so the file can't be checked here.</div>` : ""}
    ${rep ? `<div class="banner ${rep.ok ? "ok" : "bad"}"><strong>Checked with the contract's validator (tm.js).</strong></div><div class="card"><pre class="rep">${esc(lines.join("\n"))}</pre></div>` : ""}
    <div class="muted small">File: ${doc ? esc(C.fileName(doc)) : ""}. Saving it goes through the share sheet: choose "Save to Files" (or wherever you've agreed with IG). Nothing is sent by the app.</div>
    <div class="bar"><button class="primary" id="sj" ${doc ? "" : "disabled"}>Share JSON (the record)</button><button id="sc" ${doc ? "" : "disabled"}>Share CSV (to check by eye)</button></div>
    <div id="exmsg"></div>
    <button class="wide" id="home" style="margin-top:14px">Home</button>
    <div class="muted small" style="margin-top:8px">Exported: ${esc(when(s.exportedAt))}</div>`;
  $("#home").onclick = () => { A.view = "home"; render(); };
  const go = async (kind) => {
    const text = kind === "csv" ? C.csv(doc) : JSON.stringify(doc, null, 1), name = C.fileName(doc, kind);
    const done = await shareOrDownload(text, name, kind === "csv" ? "text/csv" : "application/json");
    if (done && kind === "json") { s.exportedAt = C.iso(new Date()); A.lastExport = s.exportedAt; await Store.kvSet("lastExport", A.lastExport); await Store.saveSession(s); render(); }
    if (done === false) $("#exmsg").innerHTML = `<div class="banner warn">Not saved (the share sheet was closed).</div>`;
  };
  if (doc) { $("#sj").onclick = () => go("json"); $("#sc").onclick = () => go("csv"); }
}
/** true = shared or downloaded, false = cancelled. */
async function shareOrDownload(text, name, type) {
  const file = new File([text], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return true; }
    catch (e) { if (e && e.name === "AbortError") return false; }
  }
  const url = URL.createObjectURL(file), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  return true;
}

boot().catch((e) => { $("#app").innerHTML = `<div class="banner bad">The app couldn't start: ${esc(e.message)}</div>`; });
</script>
</body>
