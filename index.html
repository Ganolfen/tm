<script>/* tm.js (Time & Motion contract checker, from the simulator project): library part only, as embedded in the app. */
(function (root) {

    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a,
    0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2]);

  // ---------------------------------------------------------------- the site file
  function checkMapping(pack) {
    const P = [], so = pack.dictionary.staffObservation;
    if (!so) return ["data-dictionary.json has no staffObservation section"];
    const M = pack.mapping.staffObservation;
    if (!M) return ["data-mapping.json has no staffObservation section"];
    const bands = so.session.fields.find((f) => f.name === "gradeBand").values;
    const acts = so.activities.map((a) => a.code), zones = (pack.site.zones || []).map((z) => z.id), kinds = so.siteFile.placeKinds;
    for (const v of M.taxonomyVersions || []) if (!so.taxonomyVersions.includes(v)) P.push(`taxonomy version ${v} isn't one the dictionary defines`);
    if (!(M.taxonomyVersions || []).length) P.push("taxonomyVersions is empty");
    for (const name of ["gradeLabels", "bandToModel"]) {
      const g = M[name] || {};
      for (const b of Object.keys(g)) if (!bands.includes(b)) P.push(`${name}: ${q(b)} isn't a grade band`);
      for (const b of bands) if (!has(g, b)) P.push(`${name}: no entry for grade band ${q(b)}`);
    }
    for (const [b, v] of Object.entries(M.bandToModel || {})) if (v !== null && !so.modelStates.grades.includes(v)) P.push(`bandToModel: ${b} -> ${q(v)} isn't an engine grade`);
    const A = M.activityToState || {};
    for (const a of Object.keys(A)) if (!acts.includes(a)) P.push(`activityToState: ${q(a)} isn't an activity`);
    for (const a of acts) if (!has(A, a)) P.push(`activityToState: no entry for activity ${q(a)}`);
    for (const [a, v] of Object.entries(A)) {
      const isObj = v !== null && typeof v === "object" && !Array.isArray(v);
      if (!isObj || !so.modelStates.values.includes(v.state)) P.push(`activityToState: ${a} -> ${q(isObj ? v.state : v)} isn't a model state`);
    }

    for (const k of Object.keys(R)) if (!has(route, k)) P.push(`places.route: ${q(k)} isn't a place in geometry.json`);
    for (const k of Object.keys(route)) if (!has(R, k)) P.push(`places.route: no entry for geometry place ${q(k)}`);
    for (const [k, n] of Object.entries(PL.numbered || {})) {
      if (!has(plan, k) || !Array.isArray(plan[k])) P.push(`places.numbered: ${q(k)} isn't a list in geometry.json's plan`);
      else if ((n.numbers || []).length !== plan[k].length) P.push(`places.numbered: ${k} has ${(n.numbers || []).length} numbers for ${plan[k].length} places in geometry.json`);
    }
    const rooms = plan.rooms || {}, PR = PL.rooms || {};
    for (const k of Object.keys(PR)) if (!has(rooms, k)) P.push(`places.rooms: ${q(k)} isn't a room in geometry.json`);
    for (const k of Object.keys(rooms)) if (!has(PR, k)) P.push(`places.rooms: no entry for geometry room ${q(k)}`);

      if (!kinds.includes(p.kind)) P.push(`place ${p.id}: kind ${q(p.kind)} isn't one of the dictionary's place kinds`);

  }
  function placesOf(pack) {
    const M = pack.mapping.staffObservation.places, G = pack.geometry, route = G.route.places, plan = G.plan, out = [];

  }

  // ---------------------------------------------------------------- the validator
  function Report(name) {
    const errors = [], warnings = [], counts = new Map();

      warn: (code, at, msg) => add(warnings, "w", code, at, msg),

/* ---------------------------------------------------------------- storage */
const Store = {
  db: null, idbOk: false, saves: 0, lastSave: null, lastError: null, chain: Promise.resolve(),
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open("tm", 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("sessions", { keyPath: "id" }); d.createObjectStore("kv"); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error("blocked"));
      });
      this.idbOk = true;
    } catch (e) { this.idbOk = false; this.lastError = "IndexedDB unavailable: " + e.message; }
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => { const t = this.db.transaction(store, mode), s = t.objectStore(store), r = fn(s);
      t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  },
  lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { this.lastError = "localStorage: " + e.message; return false; } },
  lsGet(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  /** Save a session: localStorage first (synchronous), then IndexedDB, one write after another. */
  saveSession(s) {
    s.rev += 1; s.updated = C.iso(new Date());
    const copy = JSON.parse(JSON.stringify(s));
    this.lsSet("tm.s." + s.id, copy);
    this.chain = this.chain.then(async () => {
      if (this.idbOk) { try { await this.tx("sessions", "readwrite", (st) => st.put(copy)); } catch (e) { this.lastError = "IndexedDB write: " + e.message; } }
      this.saves += 1; this.lastSave = copy.updated;
    });
    return this.chain;
  },
  async loadSessions() {
    const by = {};
    if (this.idbOk) { try { for (const s of (await this.tx("sessions", "readonly", (st) => st.getAll())) || []) by[s.id] = s; } catch (e) { this.lastError = "IndexedDB read: " + e.message; } }
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith("tm.s.")) { const s = this.lsGet(k); if (s && (!by[s.id] || s.rev > by[s.id].rev)) by[s.id] = s; } } } catch (e) { /* none */ }
    for (const s of Object.values(by)) C.upgrade(s);
    return by;
  },
  async deleteSession(id) {
    try { localStorage.removeItem("tm.s." + id); } catch (e) { /* none */ }
    if (this.idbOk) await this.tx("sessions", "readwrite", (st) => st.delete(id));
  },
  async kvSet(k, v) { this.lsSet("tm.kv." + k, v); if (this.idbOk) { try { await this.tx("kv", "readwrite", (st) => st.put(v, k)); } catch (e) { /* mirror holds it */ } } },
  async kvGet(k) {
    if (this.idbOk) { try { const v = await this.tx("kv", "readonly", (st) => st.get(k)); if (v !== undefined) return v; } catch (e) { /* fall through */ } }
    return this.lsGet("tm.kv." + k);
  },
};

async function wakeUp() {
  const s = S();

  try { A.wake = await navigator.wakeLock.request("screen"); A.wakeState = "on"; A.wake.addEventListener("release", () => { A.wakeState = "off"; }); }

}

/* ---------------------------------------------------------------- the floor plan */
const KIND_FILL = { blue: "#dbe7fb", orange: "#fde3cf", orangewr: "#fdeede", purple: "#eadcf7", resus: "#f9d6d6", paeds: "#fff1c2", green: "#d9f2df",
  hub: "#cfecef", staff: "#e5e9ee", support: "#f0f2f4", imaging: "#e6e1f5", lift: "#e2e2e2", liftcar: "#d4d4d4", stair: "#e2e2e2", entrance: "#d0e8ff" };

  else { const B = st.bounds || { xMin: 0, xMax: 10, yMin: 0, yMax: 10 }; x0 = B.xMin - 2; x1 = B.xMax + 2; y0 = B.yMin - 2; y1 = B.yMax + 2; }

    const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) c = !c; } return c; };

      const w = Math.max(...o.points.map((q) => q[0])) - Math.min(...o.points.map((q) => q[0])), name = o.name.length > 9 ? o.name.replace(/^(Blue|Paeds|Green) /, "").slice(0, 9) : o.name;

    ${recent.length ? `<div class="row" style="margin-bottom:6px">${recent.map((p) => `<button class="${p === lastPlace ? "on" : ""}" data-a="place" data-v="${esc(p)}" style="min-height:38px;font-size:14px">${esc(placeName(st, p))}</button>`).join("")}</div>` : ""}
    <div class="tabs"><button class="${zone === "all" ? "on" : ""}" data-a="zone" data-v="all">All</button>${zones.map((z) => `<button class="${zone === z.id ? "on" : ""}" data-a="zone" data-v="${esc(z.id)}">${esc(z.name)}</button>`).join("")}</div>

    <div class="muted small">${zone === "all" ? "Choose a zone above to zoom in." : "Tap a room, or a dot outside the rooms. The name shows at the bottom; Undo if wrong."} ${st.outline && st.outline.length ? "" : "(This site file has no floor plan outline.)"}</div>
    ${off.length ? `<h3>Off the plan</h3><div class="row">${off.map((p) => `<button class="${p.id === lastPlace ? "on" : ""}" data-a="place" data-v="${esc(p.id)}" style="min-height:38px;font-size:14px">${esc(p.label)}</button>`).join("")}</div>` : ""}
    <h3>All places</h3><select id="placepick"><option value="">Choose…</option>${(() => { const g = {}; for (const p of st.places) (g[p.zone || "_"] = g[p.zone || "_"] || []).push(p);

    ${closeBtn}`;
}

  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || "#888";
  let g = "";
  for (let m = 0; m <= mins; m += mins > 120 ? 30 : 15) g += `<line x1="${X(t0 + m * 60000)}" x2="${X(t0 + m * 60000)}" y1="${top - 4}" y2="${H - 16}" stroke="${css("--line")}"/><text x="${X(t0 + m * 60000)}" y="${H - 4}" font-size="10" text-anchor="middle" fill="${css("--muted")}">${hhmm(C.iso(new Date(t0 + m * 60000)))}</text>`;
  rows.forEach((r) => { g += `<text x="4" y="${Y(r) + 14}" font-size="11" fill="${css("--muted")}">${r ? "Pt " + r : "No pt"}</text>`; });
  for (const p of s.pauses) g += `<rect x="${X(Date.parse(p.start))}" y="${top}" width="${Math.max(1, X(p.end ? Date.parse(p.end) : t1) - X(Date.parse(p.start)))}" height="${rows.length * rh}" fill="${css("--muted")}" fill-opacity=".18"/>`;
  for (const r of s.intervals) { const a = Date.parse(r.start), b = r.end ? Date.parse(r.end) : t1;
    g += `<rect x="${X(a)}" y="${Y(r.patient) + 3}" width="${Math.max(1.5, X(b) - X(a))}" height="${rh - 6}" rx="2" fill="${css(colourOf(r.activity))}" fill-opacity="${r.activity === "unseen" ? 0.3 : 0.9}"><title>${esc(hhmm(r.start))} ${esc(actLabel(r.activity))}</title></rect>`; }
  for (const e of s.events) { const x = X(Date.parse(e.time)), col = e.event === "interruption" ? "--ev-int" : e.event.startsWith("help") ? "--ev-help" : "--ev-mt";
    g += `<line x1="${x}" x2="${x}" y1="4" y2="${top + rows.length * rh}" stroke="${css(col)}" stroke-width="1.2" stroke-opacity=".8"/><circle cx="${x}" cy="8" r="3.5" fill="${css(col)}"><title>${esc(clock(e.time))} ${esc(e.event)}${e.about ? " · " + esc(e.about) : ""}${e.source ? " · " + esc(SOURCE_LABEL[e.source] || e.source) : ""}${e.outcome ? " · " + esc(e.outcome) : ""}</title></circle>`; }
  return `<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, system-ui, sans-serif">${g}</svg>`;
}
function renderTimeline() {
  const s = S(); if (!s) { A.view = "home"; return render(); }
  const st = siteFor(s) || site(), now = new Date();
  const items = s.intervals.map((r) => ({ t: r.start, h: `${esc(hhmm(r.start))}–${esc(r.end ? hhmm(r.end) : "now")} ${esc(actLabel(r.activity))}${r.patient ? " · " + esc(r.patient) : ""}${r.screen === "not_seen" ? " (screen not seen)" : ""}`, seq: r.seq }))
    .concat(s.pauses.map((p) => ({ t: p.start, h: `${esc(hhmm(p.start))}–${esc(p.end ? hhmm(p.end) : "now")} <em>paused</em>` })),
      s.events.map((e) => ({ t: e.time, h: `${esc(clock(e.time))} ▸ ${esc(e.event.replace("_", " "))}${e.about ? " · " + esc(ABOUT[e.about] || e.about) : ""}${e.source ? " · " + esc(SOURCE_LABEL[e.source] || e.source) : ""}${e.outcome ? " · " + esc(e.outcome) : ""}${e.grade ? " · " + esc(e.grade) : ""}${e.activity ? " · " + esc(actLabel(e.activity)) : ""}${e.patient ? " · " + esc(e.patient) : ""}` })),
      s.context.map((c) => ({ t: c.time, h: `${esc(clock(c.time))} ▸ snapshot: waiting ${c.waiting ?? "?"}, doctors ${c.doctorsOn ?? "?"}, escalation ${c.escalation ?? "?"}` })),
      s.notes.map((n) => ({ t: n.time, h: `${esc(clock(n.time))} ▸ note: ${esc(n.text)}` })))
    .sort((a, b) => (a.t < b.t ? 1 : -1));
  $("#app").innerHTML = `
    <div class="row spread"><h1>Timeline ${esc(s.id)}</h1><button data-a="${s.status === "ended" ? "exportOf" : "open"}" data-v="${esc(s.id)}">Back</button></div>
    <div class="chart">${s.session.start ? chartSvg(s, st, now) : ""}</div>
    <div class="muted small" style="margin:4px 0 8px">Rows: no patient, then each patient tag. Colours: blue with a patient, teal computer, green talking, pink waiting, grey other; shading = paused. Dots: red interruption, blue help, green second task.</div>
    <div class="card tl">${items.map((i) => `<div class="tlrow"><span>${i.h}</span>${i.seq ? `<button data-a="relabel" data-v="${i.seq}">Change</button>` : ""}</div>`).join("") || "Nothing yet."}</div>
    <div class="muted small">${s.edits.length} correction(s) and undo(s) so far, all kept in the file's audit trail.</div>`;
}

/* ---------------------------------------------------------------- export */
function renderExport() {
  const s = S(); if (!s) { A.view = "home"; return render(); }
  const st = siteFor(s);
  let doc = null, rep = null, err = null;
  try { doc = C.exportDoc(s, TMv); rep = st ? TMv.validate(JSON.parse(JSON.stringify(doc)), st, C.fileName(doc)) : null; } catch (e) { err = e.message; }
  const lines = rep ? [`${rep.ok ? "Accepted" : "REFUSED"}: ${rep.errors.length} error(s), ${rep.warnings.length} warning(s)`]
    .concat(rep.errors.map((e) => "error   " + e.message), rep.warnings.map((w) => "warning " + w.message),
      rep.summary ? [`${rep.summary.intervals} intervals, ${rep.summary.patients} patients, ${rep.summary.events} events; observed ${hms(rep.summary.observedSec)}, out of view ${hms(rep.summary.unseenSec)}, paused ${hms(rep.summary.pausedSec)}`] : []) : [];
  const yn = (tag, field, v) => [["true", "Yes"], ["false", "No"], ["null", "?"]].map(([x, l]) => `<button class="${String(v === undefined ? null : v) === x ? "on" : ""}" data-a="flag" data-v="${esc(tag)}:${field}:${x}">${l}</button>`).join("");
  $("#app").innerHTML = `
    <div class="row spread"><h1>Export ${esc(s.id)}</h1><button data-a="timeline">Timeline</button></div>
    ${s.patients.length ? `<div class="card"><h3 style="margin-top:0">Patients</h3>
      <div class="muted small" style="margin-bottom:6px">Already theirs when the session started? Still theirs when it ended?</div>
      <div class="flags">${s.patients.map((p) => `<strong>${esc(p.tag)}</strong><div><div class="row small"><span style="width:6.5em">Started before</span><div class="opts" style="flex:1">${yn(p.tag, "startedBefore", p.startedBefore)}</div></div>
        <div class="row small" style="margin-top:4px"><span style="width:6.5em">Still theirs at end</span><div class="opts" style="flex:1">${yn(p.tag, "openAtEnd", p.openAtEnd)}</div></div></div>`).join("")}</div></div>` : ""}
    ${err ? `<div class="banner bad">${esc(err)}</div>` : ""}
    ${!st ? `<div class="banner warn">The site file for "${esc(s.siteId)}" isn't loaded, so the file can't be checked here.</div>` : ""}
    ${st && !revOk(st) ? `<div class="banner warn">Checked against an older contract (revision ${esc(revText(st))}); this app writes revision ${esc(C.CONTRACT_REVISION)}, so the simulator's check may differ.</div>` : ""}
    ${rep ? `<div class="banner ${rep.ok ? "ok" : "bad"}"><strong>Checked with the contract's validator (tm.js).</strong></div><div class="card"><pre class="rep">${esc(lines.join("\n"))}</pre></div>` : ""}
    <div class="muted small">File: ${doc ? esc(C.fileName(doc)) : ""}. Saving goes through the share sheet: choose "Save to Files" (or wherever you've agreed with IG). Nothing is sent by the app.</div>
    <div class="bar bar2"><button class="primary" data-a="share" data-v="json" ${doc ? "" : "disabled"}>Share JSON (the record)</button><button data-a="share" data-v="csv" ${doc ? "" : "disabled"}>Share CSV (to check by eye)</button></div>
    <div id="exmsg"></div>
    <button class="wide" data-a="home" style="margin-top:12px">Home</button>
    <div class="muted small" style="margin-top:8px">Exported: ${esc(when(s.exportedAt))}</div>`;
  A.doc = doc;
}
/** true = shared or downloaded, false = cancelled. */
async function shareOrDownload(text, name, type) {
  const file = new File([text], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return true; }
    catch (e) { if (e && e.name === "AbortError") return false; }
  }
  const url = URL.createObjectURL(file), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  return true;
}

/* ---------------------------------------------------------------- taps */
async function onClick(e) {
  const el = e.target.closest("[data-a]"); if (!el || el.disabled) return;
  const a = el.dataset.a, v = el.dataset.v, s = S(), st = s ? (siteFor(s) || site()) : site(), now = new Date(), sh = A.sheet;
  const close = () => { A.sheet = null; };
  switch (a) {
    case "close": close(); return renderLayer();
    case "home": close(); A.view = "home"; A.armed = null; return render();
    case "new": await askPersist(); A.view = "new"; return render();
    case "regen": $("#code").value = C.randomCode("TM"); return;
    case "ready": return createSession();
    case "open": A.cur = v; A.view = "session"; return render();
    case "exportOf": A.cur = v; A.view = "export"; return render();
    case "del":
      if (A.armed !== v) { A.armed = v; render(); setTimeout(() => { if (A.armed === v) { A.armed = null; if (A.view === "home") render(); } }, 4000); return; }
      A.armed = null; await Store.deleteSession(v); delete A.sessions[v]; return render();
    case "loadsite": return $("#sitefile").click();
    case "persist": await askPersist(); await refreshStorageInfo(); return render();
    case "update":
      try { const r = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (r) await r.update(); } catch (err) { /* offline */ }
      return location.reload();
    case "timeline": close(); A.view = "timeline"; return render();
    // --- session
    case "act": if (C.setActivity(s, st, v, now)) return save(); return;
    case "screen": { const c = C.current(s); if (c && C.setScreen(s, st, c.screen === "not_seen", now)) return save(c.screen === "not_seen" ? "Screen visible again" : "Screen not visible"); return; }
    case "pt": if (C.setPatient(s, st, v || null, now)) return save(v ? "Patient " + v : "No patient"); return;
    case "ptnew": A.sheet = { kind: "ptnew" }; return renderLayer();
    case "ptmake": { close(); const tag = C.newPatient(s, st, v === "true" ? true : v === "false" ? false : null, now); return save("Patient " + tag); }
    case "int": A.sheet = { kind: "int", t: now }; return renderLayer();
    case "intabout": sh.about = sh.about === v ? null : v; if (sh.source === "role_phone") sh.source = null; return renderLayer();
    case "intsrc": case "intout":
      if (a === "intsrc") { sh.source = v; if (v === "role_phone") sh.about = null; } else sh.outcome = v;
      if (sh.source && sh.outcome) {
        close();
        const ev = { event: "interruption", source: sh.source, about: sh.about || null, outcome: sh.outcome };
        if (!C.addEvent(s, st, ev, sh.t)) return render();
        const next = C.nextActivityFor(ev), cur = C.current(s);
        if (next && st.contract.activities.some((x) => x.code === next) && s.status === "running" && (!cur || cur.activity !== next)) {
          C.setActivity(s, st, next, new Date(Date.parse(s.events[s.events.length - 1].time) + 1), { patient: null });
          return save(`${ev.about ? ABOUT[ev.about] : "Registrar phone"}: ${actLabel(next)} started`);
        }
        return save("Interruption saved");
      }
      return renderLayer();
    case "help": A.sheet = { kind: "help", event: v, t: now }; return renderLayer();
    case "helpgrade": close(); if (C.addEvent(s, st, { event: sh.event, grade: v || null, source: v ? SOURCE_OF_GRADE[v] : null }, sh.t)) return save(sh.event === "help_asked" ? "Asked for help" : "Gave help"); return render();
    case "mt": if (s.mt) { if (C.addEvent(s, st, { event: "multitask_end" }, now)) return save("2nd task ended"); return; } A.sheet = { kind: "mt" }; return renderLayer();
    case "mtact": close(); if (C.addEvent(s, st, { event: "multitask_start", activity: v }, now)) return save("2nd task: " + actLabel(v)); return render();
    case "where": A.sheet = { kind: "where", zone: (() => { const lp = s.places.length ? st.places.find((p) => p.id === s.places[s.places.length - 1].place) : null; return (lp && lp.x !== null && lp.zone) || s.session.zone || "all"; })() }; return renderLayer();
    case "zone": sh.zone = v; return renderLayer();
    case "place": close(); if (C.setPlace(s, v, now)) return save(placeName(st, v)); return render();
    case "undo": { const w = C.undo(s, now); if (w) return save("Undone (" + w.table + ")"); return; }
    case "fix": A.sheet = { kind: "fix" }; return renderLayer();
    case "move": close(); if (C.moveStart(s, Number(v), now)) return save("Start moved back " + v + " s"); return render();
    case "relabel": { const r = s.intervals[Number(v) - 1]; A.sheet = { kind: "relabel", seq: Number(v), activity: r.activity, patient: r.patient || null }; return renderLayer(); }
    case "rlact": sh.activity = v; return renderLayer();
    case "rlpt": sh.patient = v || null; return renderLayer();
    case "rlsave": close(); if (C.relabel(s, st, sh.seq, { activity: sh.activity, patient: sh.patient }, now)) { if (s.status === "ended") s.exportedAt = null; return save("Changed"); } return render();
    case "note": A.sheet = { kind: "note" }; return renderLayer();
    case "notesave": { const t = $("#notetext").value; if (C.addNote(s, t, now)) { close(); return save("Note saved"); } return; }
    case "snap": { const last = s.context[s.context.length - 1] || {}; A.sheet = { kind: "snap", waiting: last.waiting ?? null, doctorsOn: last.doctorsOn ?? null, escalation: last.escalation ?? null }; return renderLayer(); }
    case "snapstep": { const [f, d] = v.split(":"); sh[f] = Math.max(0, (sh[f] ?? (Number(d) > 0 ? -1 : 1)) + Number(d)); return renderLayer(); }
    case "snapesc": sh.escalation = v || null; return renderLayer();
    case "snapsave": close(); if (C.addContext(s, { waiting: sh.waiting, doctorsOn: sh.doctorsOn, escalation: sh.escalation }, now)) return save("Snapshot saved"); return render();
    case "snapskip": close(); C.skipContext(s, now); return save("Snapshot skipped");
    case "pause": if (s.status === "paused" ? C.resume(s, now) : C.pause(s, now)) return save(s.status === "paused" ? "Paused" : "Resumed"); return;
    case "end":
      if (A.armed !== "end") { A.armed = "end"; render(); setTimeout(() => { if (A.armed === "end") { A.armed = null; if (A.view === "session") render(); } }, 4000); return; }
      A.armed = null; if (C.end(s, now)) { A.view = "export"; return save(); } return;
    // --- export
    case "flag": { const [tag, field, x] = v.split(":"); if (C.setFlag(s, tag, field, x === "true" ? true : x === "false" ? false : null, now)) { s.exportedAt = null; return save(); } return; }
    case "share": {
      const doc = A.doc, kind = v; if (!doc) return;
      const done = await shareOrDownload(kind === "csv" ? C.csv(doc) : JSON.stringify(doc, null, 1), C.fileName(doc, kind), kind === "csv" ? "text/csv" : "application/json");
      if (done && kind === "json") { s.exportedAt = C.iso(new Date()); A.lastExport = s.exportedAt; await Store.kvSet("lastExport", A.lastExport); return save("Exported"); }
      if (done === false) $("#exmsg").innerHTML = `<div class="banner warn">Not saved (the share sheet was closed).</div>`;
      return;
    }
  }
}
document.addEventListener("change", (e) => {
  if (e.target.id === "placepick" && e.target.value) { const s = S(), st = siteFor(s) || site(); A.sheet = null; if (C.setPlace(s, e.target.value, new Date())) save(placeName(st, e.target.value)); else render(); }
});

boot().catch((e) => { $("#app").innerHTML = `<div class="banner bad">The app couldn't start: ${esc(e.message)}</div>`; });
</script>
</body>
